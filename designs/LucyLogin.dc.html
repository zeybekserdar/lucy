<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.4;min-height:100%;display:flex;align-items:center;justify-content:center;padding:48px 0;box-sizing:border-box;-webkit-font-smoothing:antialiased">
  <form onSubmit="{{ submit }}" style="width:calc(100% - 40px);max-width:340px;display:flex;flex-direction:column;align-items:center;text-align:center">
    <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--ink);margin-bottom:24px"><path fill="currentColor" d="M5.2 2 7.4 4Q8.6 3.6 9.8 4L11.6 2.2 11.8 6C11.9 7.4 11.4 8.4 10.6 9C13.6 9.8 16.8 12.6 17.6 16.6C18.2 19.6 17.4 21.6 15.6 22.4H8.2C7.6 22.4 7.4 21.8 7.8 21.4C8.6 20.6 8.6 17.6 8.2 14.2C7.9 11.8 7 10.6 6.2 9.6C4.8 8.8 4.4 7.4 4.6 6Z"></path><path d="M15.4 22.4C19.4 22.6 21.6 21 21.4 17.6C21.3 15.6 20.2 14.4 19 14.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
    <h1 style="margin:0;font-size:28px;font-weight:650;letter-spacing:-0.02em;text-wrap:balance">{{ title }}</h1>
    <p style="margin:8px 0 28px;color:var(--ink2);text-wrap:pretty">{{ sub }}</p>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px;text-align:left">
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:550">{{ label1 }}</span>
        <input type="password" value="{{ pw1 }}" readOnly="{{ true }}" placeholder="••••••••••••" aria-invalid="{{ isError }}" style="height:44px;padding:0 14px;border-radius:12px;border:1px solid {{ borderColor }};box-shadow:{{ ring }};background:var(--surface);color:var(--ink);font:inherit;font-size:17px;letter-spacing:0.1em;outline:none" style-focus="border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklch, var(--focus) 30%, transparent)"></input>
      </label>
      <sc-if value="{{ isSetup }}" hint-placeholder-val="{{ false }}">
        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:550">Şifre (tekrar)</span>
          <input type="password" value="correct-horse-1" readOnly="{{ true }}" style="height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--sep-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;letter-spacing:0.1em;outline:none" style-focus="border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklch, var(--focus) 30%, transparent)"></input>
        </label>
        <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ok-ink)"><svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.8 10.4l2.8 2.8 5.6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>En az 12 karakter · iki alan eşleşiyor</div>
      </sc-if>
      <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--down-ink)"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="10" cy="10" r="10" fill="var(--down)"></circle><path d="M10 5.6v5.2M10 14.3v.1" stroke="var(--on-status)" stroke-width="2.2" stroke-linecap="round"></path></svg><span>Şifre yanlış. Tekrar dene.</span></div>
      </sc-if>
      <button type="submit" style="height:44px;margin-top:8px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer" style-focus="outline:2px solid var(--focus);outline-offset:2px">{{ cta }}</button>
    </div>
    <p style="margin:28px 0 0;font-size:13px;color:var(--ink2);text-wrap:pretty">{{ foot }}</p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:720},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;setup&quot;,&quot;error&quot;],&quot;default&quot;:&quot;login&quot;,&quot;tsType&quot;:&quot;'login'|'setup'|'error'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'login';
    const setup = mode === 'setup', err = mode === 'error';
    return {
      isSetup: setup, isError: err,
      title: setup ? 'Lucy’ye hoş geldin' : 'Lucy',
      sub: setup ? 'Lucy’yi yalnızca senin açabilmen için bir şifre belirle.' : 'Devam etmek için şifreni gir.',
      label1: setup ? 'Yeni şifre' : 'Şifre',
      pw1: setup ? 'correct-horse-1' : (err ? 'yanlis-sifre' : ''),
      borderColor: err ? 'var(--down)' : 'var(--sep-strong)',
      ring: err ? '0 0 0 3px color-mix(in oklch, var(--down) 22%, transparent)' : 'none',
      cta: setup ? 'Şifreyi belirle ve başla' : 'Giriş yap',
      foot: setup ? 'Şifre bu sunucuda şifrelenmiş olarak saklanır. Unutursan sunucuda lucy reset-password komutuyla sıfırlayabilirsin.' : 'Şifreni mi unuttun? Sunucuda lucy reset-password komutunu çalıştır.',
      submit: e => e.preventDefault(),
    };
  }
}
</script>
</body>
</html>
