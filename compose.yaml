services:
  lucy:
    build: .
    image: lucy:latest
    container_name: lucy
    restart: unless-stopped
    init: true
    ports:
      - "${LUCY_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      LUCY_LANG: ${LUCY_LANG:-tr}
      LUCY_PUBLIC_URL: ${LUCY_PUBLIC_URL:-}
      LUCY_NTFY_SERVER: ${LUCY_NTFY_SERVER:-https://ntfy.sh}
      LUCY_NTFY_TOPIC: ${LUCY_NTFY_TOPIC:-}
      LUCY_NTFY_TOKEN: ${LUCY_NTFY_TOKEN:-}
    volumes:
      - lucy-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  lucy-data:
